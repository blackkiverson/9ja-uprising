<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#76b6b1" />
    <title>9JA UPRISING</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="stats">
        <span id="money"></span>
        <span id="energy"></span>
        <span id="clock"></span>
        <span id="day"></span>
      </div>
      <div class="bottom">
        <div id="place"></div>
        <div id="actions"></div>
      </div>
      <div id="toast"></div>
    </div>
    <div id="npc-tags"></div>
    <div id="dialogue" hidden>
      <div class="dlg-head">
        <div><strong id="dlg-name"></strong><span id="dlg-role"></span></div>
        <span id="dlg-rel"></span>
      </div>
      <p id="dlg-text"></p>
      <div id="dlg-choices"></div>
    </div>
    <div id="intro">
      <h1><span>9JA</span><span>UPRISING</span></h1>
      <button id="begin" aria-label="Begin"><span class="top"></span><span class="front">BEGIN</span></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
