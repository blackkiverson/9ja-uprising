<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#76b6b1" />
    <title>9JA UPRISING</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="status" aria-label="Player status">
        <div id="weapon" title="Fist">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <!-- Original clenched-fist glyph, front view: four knuckles, thumb across, wrist. -->
            <g fill="#f4f4ee">
              <rect x="11" y="13" width="7" height="12" rx="3.5" />
              <rect x="18.5" y="11" width="7" height="13" rx="3.5" />
              <rect x="26" y="11.5" width="7" height="12.5" rx="3.5" />
              <rect x="33.5" y="14" width="6" height="11" rx="3" />
              <path d="M10 22h30v8c0 5-4 9-9 9h-9c-6 0-12-4-12-10z" />
              <rect x="17" y="37" width="15" height="7" rx="1.5" />
            </g>
            <path d="M12 27c4-1 10-1 16 1" fill="none" stroke="#1d2423" stroke-width="2.2" stroke-linecap="round" />
            <path d="M18 18.5v5M25.5 17v6M33 17.5v6" fill="none" stroke="#1d2423" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span id="weapon-name">FIST</span>
        </div>
        <div class="readouts">
          <div class="clock-row"><span id="clock"></span><span id="day"></span></div>
          <div class="bar energy" title="Energy"><i id="energy-fill"></i></div>
          <div class="bar health" title="Health"><i id="health-fill"></i></div>
        </div>
        <div id="money"></div>
      </div>
      <div id="losses" aria-live="polite"></div>
      <div class="bottom">
        <div id="place"></div>
        <div id="actions"></div>
      </div>
      <div id="toast"></div>
    </div>
    <div id="npc-tags"></div>
    <div id="bubbles"></div>
    <div id="clinic-pie" hidden><div class="pie"></div><span></span></div>
    <div id="tip" role="dialog" aria-live="polite" hidden>
      <div class="tip-title"></div>
      <p class="tip-body"></p>
      <div class="tip-foot">
        <label><input type="checkbox" /> Don't show me this again</label>
        <button type="button">Got it</button>
      </div>
    </div>
    <button id="sound" aria-label="Sound on or off" title="Sound (M)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
        <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <button id="exit" aria-label="Exit to title screen" title="Exit to title">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M10 5H5v14h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div id="now-playing"></div>
    <div id="dialogue" hidden>
      <div class="dlg-head">
        <div><strong id="dlg-name"></strong><span id="dlg-role"></span></div>
        <span id="dlg-rel"></span>
      </div>
      <p id="dlg-text"></p>
      <div id="dlg-choices"></div>
    </div>
    <div id="intro">
      <h1><span>9JA</span><span>UPRISING</span></h1>
      <button id="begin" aria-label="Begin"><span class="top"></span><span class="front">BEGIN</span></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
