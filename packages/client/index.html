<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#76b6b1" />
    <title>9JA UPRISING</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="stats">
        <span id="money"></span>
        <span id="energy"></span>
        <span id="clock"></span>
        <span id="day"></span>
      </div>
      <div class="bottom">
        <div id="place"></div>
        <div id="actions"></div>
      </div>
      <div id="toast"></div>
    </div>
    <div id="npc-tags"></div>
    <button id="sound" aria-label="Sound on or off" title="Sound (M)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
        <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <button id="next-track" aria-label="Next track" title="Next track (N)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 6l8 6-8 6zM13 6l8 6-8 6z" fill="currentColor" />
      </svg>
    </button>
    <div id="now-playing"></div>
    <div id="dialogue" hidden>
      <div class="dlg-head">
        <div><strong id="dlg-name"></strong><span id="dlg-role"></span></div>
        <span id="dlg-rel"></span>
      </div>
      <p id="dlg-text"></p>
      <div id="dlg-choices"></div>
    </div>
    <div id="intro">
      <h1><span>9JA</span><span>UPRISING</span></h1>
      <button id="begin" aria-label="Begin"><span class="top"></span><span class="front">BEGIN</span></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
